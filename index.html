<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Mother's Day 💕</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: linear-gradient(180deg, #fce4f0 0%, #fff0f5 60%, #f0e4ff 100%);
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

#app {
  width: 100%; max-width: 580px;
  min-height: 100vh;
  background: linear-gradient(180deg, #fce4f0 0%, #fff0f5 60%, #f0e4ff 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 0 1rem 2rem;
  position: relative; overflow: hidden;
}

.ribbon {
  position: fixed; top: 0; left: 0; right: 0; height: 7px; z-index: 100;
  background: repeating-linear-gradient(90deg,#f5a0c0,#f5a0c0 20px,#d4a0f5 20px,#d4a0f5 40px);
}

.header { text-align: center; padding: 30px 0 14px; z-index: 2; position: relative; }
.header h1 { font-size: 26px; font-weight: 500; color: #a0346e; }
.header p  { font-size: 13px; color: #c2607a; margin-top: 4px; }

#stage {
  width: 100%; max-width: 560px;
  height: 380px;
  position: relative; z-index: 2;
  overflow: hidden;
}

.balloon-actor {
  position: absolute;
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer;
  bottom: -160px;
}

.balloon-actor.fly-in {
  animation: flyIn 1.4s cubic-bezier(0.22,1,0.36,1) forwards;
}

.balloon-actor.floating {
  animation: floatHover var(--dur,3.2s) ease-in-out infinite alternate;
}

.balloon-actor.popping .bal-body {
  animation: popBurst 0.28s ease forwards;
}

@keyframes flyIn {
  0%   { bottom: -160px; opacity: 0.5; transform: scale(0.7) rotate(-5deg); }
  60%  { opacity: 1; transform: scale(1.05) rotate(2deg); }
  80%  { transform: scale(0.97) rotate(-1deg); }
  100% { bottom: var(--land-y); transform: scale(1) rotate(0deg); opacity: 1; }
}

@keyframes floatHover {
  0%   { transform: translateY(0px) rotate(-2deg); }
  100% { transform: translateY(-18px) rotate(2deg); }
}

@keyframes popBurst {
  0%   { transform: scale(1); opacity: 1; }
  50%  { transform: scale(1.5); opacity: 0.4; }
  100% { transform: scale(0); opacity: 0; }
}

.bal-body {
  width: 82px; height: 96px;
  border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset -7px -7px 18px rgba(0,0,0,0.11), inset 5px 4px 10px rgba(255,255,255,0.45);
  transition: transform 0.13s;
}
.balloon-actor:not(.popping):hover .bal-body { transform: scale(1.09); }

.bal-shine {
  position: absolute; top: 14px; left: 16px;
  width: 16px; height: 22px;
  background: rgba(255,255,255,0.5);
  border-radius: 50%; transform: rotate(-30deg);
}
.bal-icon { font-size: 26px; z-index: 1; }
.bal-num {
  position: absolute; top: -8px; right: -8px;
  width: 20px; height: 20px;
  background: white; border-radius: 50%;
  font-size: 10px; font-weight: 600; color: #a0346e;
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid #f5a0c0;
}
.bal-knot { width: 8px; height: 8px; border-radius: 50%; margin-top: -3px; }
.bal-string { width: 1.5px; height: 34px; background: #c8c8c8; }
.bal-label {
  font-size: 11px; color: #a0346e; font-weight: 500;
  margin-top: 5px; text-align: center; max-width: 90px; line-height: 1.3;
}

.confetti-piece {
  position: fixed; width: 7px; height: 7px; border-radius: 2px;
  pointer-events: none; z-index: 999;
  animation: confettiFall 1.2s ease forwards;
}
@keyframes confettiFall {
  0%   { transform: translate(0,0) rotate(0deg); opacity: 1; }
  100% { transform: translate(var(--tx),var(--ty)) rotate(720deg); opacity: 0; }
}

.progress-wrap { z-index: 2; text-align: center; margin-top: 8px; }
.progress-wrap p { font-size: 12px; color: #c2607a; margin-bottom: 6px; }
.progress-track { width: 220px; height: 6px; background: rgba(162,52,110,0.15); border-radius: 99px; overflow: hidden; margin: 0 auto; }
.progress-fill  { height: 100%; background: #d4537a; border-radius: 99px; transition: width 0.4s ease; }

.overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(255,240,248,0.8); backdrop-filter: blur(4px);
  z-index: 50;
}
.modal {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%,-50%) scale(0);
  background: white; border-radius: 22px;
  padding: 1.6rem 1.6rem 1.4rem; text-align: center;
  z-index: 60; width: 92%; max-width: 360px;
  animation: cardPop 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
  box-shadow: 0 10px 50px rgba(160,52,110,0.2);
}
@keyframes cardPop {
  from { transform: translate(-50%,-50%) scale(0); }
  to   { transform: translate(-50%,-50%) scale(1); }
}
.modal-icon { font-size: 34px; margin-bottom: 8px; }
.modal h2 { font-size: 18px; color: #a0346e; font-weight: 500; margin-bottom: 6px; }
.modal p  { font-size: 13px; color: #666; line-height: 1.75; }

.photo-area { margin: 12px 0; }
.photo-preview { width: 100%; max-height: 180px; object-fit: cover; border-radius: 14px; border: 2px solid #f5c6da; display: none; }
.photo-placeholder {
  border: 2px dashed #f5c6da; border-radius: 14px;
  padding: 24px 14px; cursor: pointer; color: #c2607a;
  font-size: 13px; background: #fff5f9; transition: background 0.2s;
}
.photo-placeholder:hover { background: #ffe8f2; }
.photo-placeholder .ph-icon { font-size: 26px; display: block; margin-bottom: 6px; }
input[type=file] { display: none; }

.voice-area { margin: 12px 0; }
.record-btn {
  background: #fee2f0; border: 2px solid #f5a0c0;
  border-radius: 50px; padding: 10px 22px;
  font-size: 13px; color: #a0346e; cursor: pointer;
  font-family: inherit; display: flex;
  align-items: center; gap: 8px; margin: 0 auto;
  transition: all 0.2s;
}
.record-btn.recording {
  background: #fca5a5; border-color: #f87171; color: #991b1b;
  animation: pulse 1s infinite;
}
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,0.4);}50%{box-shadow:0 0 0 9px rgba(248,113,113,0);} }
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: #d4537a; flex-shrink: 0; }
.record-btn.recording .rec-dot { background: #ef4444; }
.audio-player { margin-top: 10px; display: none; }
.audio-player audio { width: 100%; border-radius: 8px; }
.rec-timer { font-size: 12px; color: #c2607a; margin-top: 6px; display: none; }

.close-btn {
  margin-top: 14px; background: #f5c6da; border: none;
  border-radius: 50px; padding: 9px 26px;
  font-size: 13px; color: #a0346e; cursor: pointer;
  font-family: inherit; transition: background 0.15s;
}
.close-btn:hover { background: #f0a8c8; }

.final-view {
  display: none; z-index: 2; position: relative;
  text-align: center; padding: 80px 20px 40px;
  animation: fadeUp 0.6s ease forwards;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);} }
.big-heart { font-size: 50px; display: block; animation: hb 0.8s infinite alternate; }
@keyframes hb { from{transform:scale(1);}to{transform:scale(1.15);} }
.final-view h1 { font-size: 28px; color: #a0346e; font-weight: 500; margin: 12px 0 10px; }
.final-view p  { font-size: 14px; color: #c2607a; line-height: 1.8; max-width: 340px; margin: 0 auto; }
.restart-btn {
  margin-top: 1.2rem; background: #a0346e; color: white;
  border: none; border-radius: 50px; padding: 11px 30px;
  font-size: 14px; cursor: pointer; font-family: inherit;
  transition: background 0.15s;
}
.restart-btn:hover { background: #c0456e; }

.star { position: fixed; opacity: 0.3; font-size: 9px; pointer-events: none; animation: twinkle 3s infinite alternate; z-index: 0; }
@keyframes twinkle { 0%{opacity:0.1;}100%{opacity:0.45;} }
</style>
</head>
<body>
<div class="ribbon"></div>
<div id="app">

  <div id="mainView" style="width:100%;display:flex;flex-direction:column;align-items:center;">
    <div class="header">
      <h1>Happy Mother's Day 💕</h1>
      <p>Tap each balloon to pop it &amp; find a surprise inside!</p>
    </div>
    <div id="stage"></div>
    <div class="progress-wrap">
      <p id="progressText">Balloon 1 of 6 incoming…</p>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="final-view" id="finalView">
    <span class="big-heart">💖</span>
    <h1>You're the best Mom!</h1>
    <p>Every balloon held a piece of our love. Thank you for being our sunshine, our safe place, and our greatest blessing. Today is all yours!</p>
    <button class="restart-btn" onclick="resetAll()">Replay 🎈</button>
  </div>

</div>

const X_POSITIONS = [12, 58, 32, 70, 8, 48];
const LAND_Y_PX   = [60, 45, 85, 35, 65, 50];
const FLOAT_DUR   = ['3.1s','3.7s','3.3s','3.9s','3.2s','3.6s'];

let currentIdx = 0, poppedCount = 0, modalOpen = false;
let mediaRecorder = null, audioChunks = [], recordedBlob = null;
let timerInterval = null, recSeconds = 0;
const photoDataURLs = [
null,   // Balloon 1 photo
null,   // Balloon 2 photo
  null,  // Balloon 3 photo ⚠️ check filename spelling
  null,            // Balloon 4 photo — replace null with './yourphoto.jpg' or base64
  null,            // Balloon 5 photo — replace null with './yourphoto.jpg' or base64
];
const stage = document.getElementById('stage');

function makeStars() {
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.textContent = ['✦','✧','⋆'][i%3];
    s.style.cssText = `left:${Math.random()*93}%;top:${Math.random()*93}%;animation-delay:${(Math.random()*3).toFixed(1)}s`;
    document.body.appendChild(s);
  }
}

function launchBalloon(idx) {
  if (idx >= BALLOONS.length) return;
  const b = BALLOONS[idx];
  const landY = LAND_Y_PX[idx];
  const el = document.createElement('div');
  el.className = 'balloon-actor fly-in';
  el.id = 'bal_' + idx;
  el.style.cssText = `left:${X_POSITIONS[idx]}%;--land-y:${landY}px;--dur:${FLOAT_DUR[idx]};`;
  el.innerHTML = `
    <div class="bal-body" style="background:${b.color};">
      <div class="bal-shine"></div>
      <span class="bal-icon">${b.icon}</span>
      <div class="bal-num">${idx+1}</div>
    </div>
    <div class="bal-knot" style="background:${b.color};"></div>
    <div class="bal-string"></div>
    <div class="bal-label">${b.title}</div>
  `;
  el.addEventListener('click', () => popBalloon(idx, el, b));
  stage.appendChild(el);
  setTimeout(() => {
    if (!el.dataset.popped) {
      el.style.bottom = landY + 'px';
      el.classList.remove('fly-in');
      el.classList.add('floating');
    }
  }, 1420);
  updateProgress(idx);
}

function popBalloon(idx, el, b) {
  if (el.dataset.popped || modalOpen) return;
  el.dataset.popped = '1';
  el.classList.add('popping');
  el.classList.remove('floating');
  const rect = el.getBoundingClientRect();
  spawnConfetti(rect.left + rect.width/2, rect.top + rect.height/2);
  poppedCount++;
  document.getElementById('progressFill').style.width = Math.round(poppedCount/6*100) + '%';
  setTimeout(() => { el.style.opacity='0'; el.style.pointerEvents='none'; }, 290);
  setTimeout(() => showModal(b, idx), 360);
}

function spawnConfetti(cx, cy) {
  const cols = ['#F9A8D4','#C4B5FD','#FCA5A5','#86EFAC','#FCD34D','#93C5FD','#ff6b8a','#a78bfa'];
  for (let i = 0; i < 28; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.background = cols[i % cols.length];
    c.style.left = cx + 'px'; c.style.top = cy + 'px';
    const ang = Math.random()*360, dist = 55 + Math.random()*90;
    c.style.setProperty('--tx', Math.cos(ang*Math.PI/180)*dist + 'px');
    c.style.setProperty('--ty', Math.sin(ang*Math.PI/180)*dist + 'px');
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1300);
  }
}

function updateProgress(idx) {
  document.getElementById('progressText').textContent =
    idx < 5 ? `Balloon ${idx+1} of 6 — pop it!` : 'Last balloon — the big surprise! 🎤';
}

function showModal(b, idx) {
  modalOpen = true;
  const ov = document.createElement('div'); ov.className = 'overlay'; document.body.appendChild(ov);
  const m  = document.createElement('div'); m.className  = 'modal';

  let extra = '';
  if (b.type === 'photo') {
    const pi = b.photoIndex, src = photoDataURLs[pi] || '';
    extra = `
      <div class="photo-area">
        <input type="file" id="fi_${pi}" accept="image/*">
        <img class="photo-preview" id="pi_${pi}" src="${src}" style="${src?'display:block':'display:none'}">
        <div class="photo-placeholder" id="ph_${pi}" style="${src?'display:none':''}" onclick="document.getElementById('fi_${pi}').click()">
          <span class="ph-icon">📷</span>Tap to add a photo
        </div>
      </div>`;
  } else if (b.type === 'voice') {
    if (VOICE_NOTE_BASE64) {
      extra = `
        <div class="voice-area">
          <p style="font-size:13px;color:#c2607a;margin-bottom:8px;">🎙️ A voice note just for you 💕</p>
          <div class="audio-player" style="display:block;"><audio id="audioEl" controls src="${VOICE_NOTE_BASE64}"></audio></div>
        </div>`;
    } else {
      extra = `
        <div class="voice-area">
          <button class="record-btn" id="recBtn" onclick="toggleRecord()">
            <div class="rec-dot"></div> Tap to record a voice note
          </button>
          <div class="rec-timer" id="recTimer">⏺ 0:00</div>
          <div class="audio-player" id="audioPlayer"><audio id="audioEl" controls></audio></div>
        </div>`;
    }
  }

  m.innerHTML = `
    <div class="modal-icon">${b.icon}</div>
    <h2>${b.title}</h2>
    <p>${b.msg}</p>
    ${extra}
    <button class="close-btn" id="closeMBtn">Close 💕</button>
  `;
  document.body.appendChild(m);

  if (b.type === 'photo') {
    const fi = m.querySelector(`#fi_${b.photoIndex}`);
    if (fi) fi.addEventListener('change', e => handlePhoto(e, b.photoIndex));
  }

  if (b.type === 'voice' && !VOICE_NOTE_BASE64 && recordedBlob) {
    const url = URL.createObjectURL(recordedBlob);
    m.querySelector('#audioEl').src = url;
    m.querySelector('#audioPlayer').style.display = 'block';
    m.querySelector('#recBtn').innerHTML = '<div class="rec-dot"></div> Re-record';
  }

  m.querySelector('#closeMBtn').addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
    m.remove(); ov.remove();
    modalOpen = false;
    if (poppedCount === 6) {
      setTimeout(() => {
        document.getElementById('mainView').style.display = 'none';
        document.getElementById('finalView').style.display = 'block';
      }, 400);
    } else {
      currentIdx++;
      document.getElementById('progressText').textContent = `Balloon ${currentIdx+1} of 6 incoming…`;
      setTimeout(() => launchBalloon(currentIdx), 500);
    }
  });
}

function handlePhoto(e, pi) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    photoDataURLs[pi] = ev.target.result;
    const img = document.getElementById('pi_'+pi), ph = document.getElementById('ph_'+pi);
    if (img) { img.src = ev.target.result; img.style.display = 'block'; }
    if (ph)  { ph.style.display = 'none'; }
  };
  reader.readAsDataURL(file);
}

function toggleRecord() {
  if (!mediaRecorder || mediaRecorder.state === 'inactive') startRecording();
  else stopRecording();
}

function startRecording() {
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
      stream.getTracks().forEach(t => t.stop());
      const url = URL.createObjectURL(recordedBlob);
      const ap = document.getElementById('audioPlayer'), ae = document.getElementById('audioEl');
      if (ap && ae) { ae.src = url; ap.style.display = 'block'; }
      const btn = document.getElementById('recBtn');
      if (btn) { btn.innerHTML = '<div class="rec-dot"></div> Re-record'; btn.classList.remove('recording'); }
      const timer = document.getElementById('recTimer');
      if (timer) timer.style.display = 'none';
      clearInterval(timerInterval);
    };
    mediaRecorder.start();
    recSeconds = 0;
    const btn = document.getElementById('recBtn');
    if (btn) { btn.innerHTML = '<div class="rec-dot"></div> Stop recording'; btn.classList.add('recording'); }
    const timer = document.getElementById('recTimer');
    if (timer) timer.style.display = 'block';
    timerInterval = setInterval(() => {
      recSeconds++;
      const mm = Math.floor(recSeconds/60), ss = recSeconds%60;
      const t = document.getElementById('recTimer');
      if (t) t.textContent = `⏺ ${mm}:${ss.toString().padStart(2,'0')}`;
    }, 1000);
  }).catch(() => alert('Microphone access denied. Please allow mic permissions and try again.'));
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop(); clearInterval(timerInterval);
  }
}

function resetAll() {
  currentIdx = 0; poppedCount = 0; modalOpen = false;
  recordedBlob = null; mediaRecorder = null; audioChunks = [];
  stage.innerHTML = '';
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('mainView').style.display = 'flex';
  document.getElementById('finalView').style.display = 'none';
  setTimeout(() => launchBalloon(0), 300);
}

makeStars();
setTimeout(() => launchBalloon(0), 400);
</script>
